<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Age distribution of licence holders and crash-involved drivers, 2024</title>
<desc id="desc">Two age distributions. Licence-holder shares and injury-crash-involved-driver shares are each normalised separately to 100 percent across the seven age bands.</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#52514e}.title{font-size:24px;font-weight:700;fill:#0b0b0b}.axis{font-size:16px}.tick{font-size:15px}.legend{font-size:17px;fill:#0b0b0b}.grid{stroke:#e6e5e1;stroke-width:1}.base{stroke:#d7d6d2;stroke-width:1.2}</style>
<text class="title" x="90" y="38">Age distribution of licence holders and crash-involved drivers, 2024</text>
<line class="grid" x1="90" y1="435" x2="965" y2="435"/>
<text class="tick" x="76" y="440" text-anchor="end">0%</text>
<line class="grid" x1="90" y1="364" x2="965" y2="364"/>
<text class="tick" x="76" y="369" text-anchor="end">20%</text>
<line class="grid" x1="90" y1="293" x2="965" y2="293"/>
<text class="tick" x="76" y="298" text-anchor="end">40%</text>
<line class="grid" x1="90" y1="221.99999999999997" x2="965" y2="221.99999999999997"/>
<text class="tick" x="76" y="226.99999999999997" text-anchor="end">60%</text>
<line class="grid" x1="90" y1="151" x2="965" y2="151"/>
<text class="tick" x="76" y="156" text-anchor="end">80%</text>
<line class="grid" x1="90" y1="80" x2="965" y2="80"/>
<text class="tick" x="76" y="85" text-anchor="end">100%</text>
<line class="base" x1="90" y1="435" x2="965" y2="435"/>
<text class="axis" transform="translate(25 257.5) rotate(-90)" text-anchor="middle">Share of each total</text>
<rect x="110.8" y="412.4" width="38.8" height="22.6" fill="#2a78d6"/>
<rect x="155.5" y="385.0" width="38.8" height="50.0" fill="#eb6834"/>
<text class="tick" x="152.5" y="463" text-anchor="middle">15–24</text>
<rect x="235.8" y="386.6" width="38.8" height="48.4" fill="#2a78d6"/>
<rect x="280.5" y="365.6" width="38.8" height="69.4" fill="#eb6834"/>
<text class="tick" x="277.5" y="463" text-anchor="middle">25–34</text>
<rect x="360.8" y="369.7" width="38.8" height="65.3" fill="#2a78d6"/>
<rect x="405.5" y="363.2" width="38.8" height="71.8" fill="#eb6834"/>
<text class="tick" x="402.5" y="463" text-anchor="middle">35–44</text>
<rect x="485.8" y="351.4" width="38.8" height="83.6" fill="#2a78d6"/>
<rect x="530.5" y="355.4" width="38.8" height="79.6" fill="#eb6834"/>
<text class="tick" x="527.5" y="463" text-anchor="middle">45–54</text>
<rect x="610.8" y="366.5" width="38.8" height="68.5" fill="#2a78d6"/>
<rect x="655.5" y="383.8" width="38.8" height="51.2" fill="#eb6834"/>
<text class="tick" x="652.5" y="463" text-anchor="middle">55–64</text>
<rect x="735.8" y="392.2" width="38.8" height="42.8" fill="#2a78d6"/>
<rect x="780.5" y="413.8" width="38.8" height="21.2" fill="#eb6834"/>
<text class="tick" x="777.5" y="463" text-anchor="middle">65–74</text>
<rect x="860.8" y="411.2" width="38.8" height="23.8" fill="#2a78d6"/>
<rect x="905.5" y="423.3" width="38.8" height="11.7" fill="#eb6834"/>
<text class="tick" x="902.5" y="463" text-anchor="middle">75 and over</text>
<rect x="110" y="495" width="25" height="16" fill="#2a78d6"/><text class="legend" x="145" y="508">Licence holders</text>
<rect x="335" y="495" width="25" height="16" fill="#eb6834"/><text class="legend" x="370" y="508">Drivers involved in injury crashes</text>
</svg>
