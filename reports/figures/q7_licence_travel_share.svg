<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Age distribution of licence holders and crash-involved drivers, 2024</title>
<desc id="desc">Licence-holder shares and injury-crash-involved-driver shares are each normalised separately to 100 percent across the seven age bands.</desc>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;fill:#52514e}.title{font-size:24px;font-weight:700;fill:#0b0b0b}.axis{font-size:16px}.tick{font-size:15px}.legend{font-size:17px;fill:#0b0b0b}.grid{stroke:#e6e5e1;stroke-width:1}.base{stroke:#d7d6d2;stroke-width:1.2}</style>
<text class="title" x="90" y="38">Age distribution of licence holders and crash-involved drivers, 2024</text>
<line class="grid" x1="90" y1="435" x2="965" y2="435"/>
<text class="tick" x="76" y="440" text-anchor="end">0%</text>
<line class="grid" x1="90" y1="316.66666666666663" x2="965" y2="316.66666666666663"/>
<text class="tick" x="76" y="321.66666666666663" text-anchor="end">10%</text>
<line class="grid" x1="90" y1="198.33333333333331" x2="965" y2="198.33333333333331"/>
<text class="tick" x="76" y="203.33333333333331" text-anchor="end">20%</text>
<line class="grid" x1="90" y1="80" x2="965" y2="80"/>
<text class="tick" x="76" y="85" text-anchor="end">30%</text>
<line class="base" x1="90" y1="435" x2="965" y2="435"/>
<text class="axis" transform="translate(25 257.5) rotate(-90)" text-anchor="middle">Share of each total</text>
<rect x="110.8" y="359.8" width="38.8" height="75.2" fill="#2a78d6"/>
<rect x="155.5" y="268.3" width="38.8" height="166.7" fill="#eb6834"/>
<text class="tick" x="152.5" y="463" text-anchor="middle">15–24</text>
<rect x="235.8" y="273.6" width="38.8" height="161.4" fill="#2a78d6"/>
<rect x="280.5" y="203.6" width="38.8" height="231.4" fill="#eb6834"/>
<text class="tick" x="277.5" y="463" text-anchor="middle">25–34</text>
<rect x="360.8" y="217.4" width="38.8" height="217.6" fill="#2a78d6"/>
<rect x="405.5" y="195.5" width="38.8" height="239.5" fill="#eb6834"/>
