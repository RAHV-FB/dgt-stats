<rect x="110" y="495" width="25" height="16" fill="#2a78d6"/><text class="legend" x="145" y="508">Licence holders</text>
<rect x="335" y="495" width="25" height="16" fill="#eb6834"/><text class="legend" x="370" y="508">Drivers involved in injury crashes</text>
