[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgt-stats"
version = "1.0.0"
description = "Road safety in Spain from DGT open data: a reconciled pipeline, nine analyses and a static site"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
  "pandas>=2.2.2",
  "pyarrow>=17.0",
  "pymupdf>=1.24.3",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dgt_stats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: checks that read every raw file in full; run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py311"

# Named rather than left to the default, so that a new ruff release cannot change what the
# repository is checked against: pycodestyle errors, the pyflakes set and import sorting.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
