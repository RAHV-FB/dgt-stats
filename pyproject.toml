[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dgt-stats"
version = "0.1.0"
description = "Reproducible analysis of Spanish road safety and crash data from DGT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
geo = [
  "contextily>=1.6",
  "geopandas>=1.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dgt_stats"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
