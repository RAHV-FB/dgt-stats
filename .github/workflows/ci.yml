name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build the data layers, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

      # The staging and processed layers of the national data are rebuilt from the raw files in
      # data/raw, which are tracked. They take about six minutes to build, so they are cached on
      # the raw files and on the code that reads them; the reconciliation checks rerun either way.
      - name: Restore the data layers
        uses: actions/cache@v4
        with:
          path: |
            data/staging/dgt
            data/processed/dgt_accidentes.parquet
          key: >-
            data-${{ hashFiles('data/raw/manifest.csv',
            'src/dgt_stats/io_*.py', 'src/dgt_stats/codes.py',
            'src/dgt_stats/derive.py', 'src/dgt_stats/labels.py',
            'scripts/ingest.py', 'scripts/build_tables.py') }}

      - name: Build the staging layer and reconcile against DGT's published totals
        run: python scripts/ingest.py all

      - name: Build the processed layer
        run: python scripts/build_tables.py

      - name: Fit the associations in DGT crash records
        run: python scripts/model.py

      # The regional crash-record layers (Catalonia, Barcelona): staging, canonical tables, the
      # data-quality report, the feature tables, the descriptive tables and the source comparison,
      # rebuilt from the raw files on every run (a few minutes). The source models and their
      # validation take about an hour and write committed tables, so CI does not refit them; the
      # tests check the feature tables, the leakage catalogue, the split isolation, the decision
      # rules and the committed validation tables directly.
      - name: Build the regional layers
        env:
          OMP_NUM_THREADS: "1"
        run: |
          python scripts/microdata.py build
          python scripts/microdata.py quality
          python scripts/microdata.py features
          python scripts/microdata.py analyse
          python scripts/microdata.py sources

      - name: Test
        run: pytest
