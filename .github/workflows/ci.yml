name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build the data layers, test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

      # The staging and processed layers of the national data are rebuilt from the raw files in
      # data/raw, which are tracked. They take about six minutes to build, so they are cached on
      # the raw files and on the code that reads them; the reconciliation checks rerun either way.
      - name: Restore the data layers
        uses: actions/cache@v4
        with:
          path: |
            data/staging/dgt
            data/processed/dgt_accidentes.parquet
          key: >-
            data-${{ hashFiles('data/raw/manifest.csv',
            'src/dgt_stats/national/io_*.py', 'src/dgt_stats/agebands.py',
            'src/dgt_stats/national/codes.py', 'src/dgt_stats/national/derive.py',
            'src/dgt_stats/national/labels.py', 'src/dgt_stats/national/stages.py') }}

      - name: "National: build the staging layer and reconcile against DGT's published totals"
        run: python scripts/run.py national.ingest national.reconcile

      - name: "National: build the processed layer"
        run: python scripts/run.py national.process

      - name: "National: fit the associations in DGT crash records"
        run: python scripts/run.py national.associations

      # The regional crash-record layers (Catalonia, Barcelona): staging, canonical tables, the
      # data-quality report, the feature tables, the descriptive tables and the source comparison,
      # rebuilt from the raw files on every run (a few minutes). The source models and their
      # validation take about half an hour and write committed tables, so CI does not refit them;
      # the tests check the feature tables, the leakage catalogue, the split isolation, the
      # decision rules and the committed validation tables directly.
      - name: "Regional: build the layers, the quality report, the feature tables and the comparisons"
        env:
          OMP_NUM_THREADS: "1"
        run: >-
          python scripts/run.py regional.build regional.quality models.features
          regional.analyse sources.profile

      # Every table and document the steps above regenerate must match the committed copy, and
      # none may be new, so that a downloadable table or a generated document cannot go stale.
      # They reproduce byte for byte on this runner, the DGT associations' fits included.
      - name: Check the regenerated tables and documents match the committed copies
        run: |
          git status --short -- reports docs
          git diff --exit-code -- reports docs
          test -z "$(git status --porcelain -- reports docs)"

      - name: Test
        run: pytest

  browser:
    name: Build the site and test it in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies and a browser
        run: |
          pip install --require-hashes -r requirements.lock
          pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      # The site is built from the committed result tables and figures alone, so this job needs
      # none of the data layers; the browser tests run the pages, the calculator and both themes.
      - name: Build the site
        run: python scripts/run.py site

      # The committed pages must be the ones the committed tables build; otherwise a page in the
      # repository would say something its source no longer does.
      - name: Check the committed pages match the build
        run: |
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)" || { git status --porcelain -- site; exit 1; }

      - name: Test the built site in a browser
        env:
          REQUIRE_BROWSER: "1"
        run: pytest tests/site/test_site_browser.py tests/site/test_tools_browser.py
