name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build the data layers, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

      # The interim and processed layers are rebuilt from the raw files in data/raw, which are
      # tracked. They take about six minutes to build, so they are cached on the raw files and on
      # the code that reads them; the reconciliation checks rerun either way.
      - name: Restore the data layers
        uses: actions/cache@v4
        with:
          path: |
            data/interim
            data/processed
          key: >-
            data-${{ hashFiles('data/raw/manifest.csv',
            'src/dgt_stats/io_*.py', 'src/dgt_stats/codes.py',
            'src/dgt_stats/derive.py', 'src/dgt_stats/labels.py',
            'scripts/ingest.py', 'scripts/build_tables.py') }}

      - name: Build the interim layer and reconcile against DGT's published totals
        run: python scripts/ingest.py all

      - name: Build the processed layer
        run: python scripts/build_tables.py

      - name: Fit the severity models
        run: python scripts/model.py

      - name: Test
        run: pytest
