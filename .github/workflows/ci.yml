name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, rebuild every table and figure, test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements.lock

      # Every generated file under reports/ must be rewritten after this moment.
      - name: Mark the start of the pipeline
        run: touch "$RUNNER_TEMP/pipeline-start"

      - name: Lint
        run: |
          ruff check src scripts tests
          ruff format --check src scripts tests

      # The staging and processed layers of the national data are rebuilt from the raw files in
      # data/raw, which are tracked. They take about six minutes to build, so they are cached on
      # the raw files and on the code that reads them; the reconciliation checks rerun either way.
      - name: Restore the data layers
        uses: actions/cache@v4
        with:
          path: |
            data/staging/dgt
            data/processed/dgt_accidentes.parquet
          key: >-
            data-${{ hashFiles('data/raw/manifest.csv',
            'src/dgt_stats/io_*.py', 'src/dgt_stats/agebands.py', 'src/dgt_stats/codes.py',
            'src/dgt_stats/derive.py', 'src/dgt_stats/labels.py', 'src/dgt_stats/validate.py',
            'src/dgt_stats/paths.py', 'scripts/ingest.py', 'scripts/build_tables.py') }}

      - name: Build the staging layer and reconcile against DGT's published totals
        run: python scripts/ingest.py all

      - name: Build the processed layer
        run: python scripts/build_tables.py

      # The fitted models run on one BLAS thread so that their coefficients reproduce byte for byte.
      - name: Rebuild the national tables
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/model.py
          python scripts/analyse.py tables

      - name: Rebuild the Catalan and Barcelona layers and tables
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/microdata.py build
          python scripts/microdata.py quality
          python scripts/microdata.py features
          python scripts/microdata.py analyse
          python scripts/microdata.py sources

      - name: Fit the Catalan severity model
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python scripts/severity_model.py

      - name: Rebuild the travel-survey tables and the driver-age risk
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python scripts/emef.py all
          python scripts/exposure_risk.py all

      - name: Rebuild the figures
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python scripts/analyse.py figures

      # Every table, figure and document the steps above regenerate must match the committed copy,
      # and none may be new. docs/FINDINGS.md is written by the site build, so it is checked in the
      # browser job and left out here.
      # On one machine every file reproduces byte for byte. Across machines the last digits of some
      # fitted results move with the processor's numerical kernels, and a figure is laid out from
      # text measured on the machine that draws it. So the documents must match byte for byte, and
      # scripts/compare_reports.py checks the tables (every number within one part in a thousand)
      # and the figures (everything they print identical), and that no file is new or missing.
      - name: Check the rebuilt tables, figures and documents match the committed copies
        run: |
          git status --short -- reports docs
          git diff --exit-code -- docs ':(exclude)docs/FINDINGS.md'
          test -z "$(git status --porcelain -- docs ':(exclude)docs/FINDINGS.md')"
          python scripts/compare_reports.py --rebuilt-after "$RUNNER_TEMP/pipeline-start"

      - name: Test
        run: pytest

  browser:
    name: Build the site and test it in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the locked dependencies and a browser
        run: |
          pip install --require-hashes -r requirements.lock
          pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      # The site is built from the committed result tables and figures alone, so this job needs
      # none of the data layers.
      - name: Build the site
        run: python scripts/build_site.py

      # The committed pages and findings must be the ones the committed tables build; otherwise a
      # page in the repository would say something its source no longer does.
      - name: Check the committed pages and findings match the build
        run: |
          git diff --exit-code -- site docs/FINDINGS.md
          test -z "$(git status --porcelain -- site docs/FINDINGS.md)" || { git status --porcelain -- site docs/FINDINGS.md; exit 1; }

      - name: Test the built site in a browser
        env:
          REQUIRE_BROWSER: "1"
        run: pytest tests/test_site_browser.py tests/test_tools_browser.py
