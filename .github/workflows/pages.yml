name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "reports/**"
      - "src/dgt_stats/**"
      - "scripts/build_site.py"
      - "requirements.lock"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install --require-hashes -r requirements.lock
          pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - run: python scripts/build_site.py
      # Deploy only pages that match the committed ones, with no page the build writes that is
      # not committed, and that pass the site's own tests, the calculator's engine against the
      # model and the pages in a browser: a push straight to main cannot publish a page the
      # checks would reject.
      - run: |
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)" || { git status --porcelain -- site; exit 1; }
      - run: pytest -q tests/test_site.py tests/test_site_editorial.py tests/test_site_design.py tests/test_severity_engine.py
      - run: pytest -q tests/test_site_browser.py
        env:
          REQUIRE_BROWSER: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
