name: Publish site

# Deploys only after the Checks workflow has succeeded on main, so a page the checks would reject
# is never published. Checks already ran the tests, so none run here.
on:
  workflow_run:
    workflows: ["Checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the locked dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Build the site
        run: python scripts/build_site.py
      # Deploy only pages that match the committed ones, with no page the build writes that is
      # not committed.
      - name: Check the build matches the committed pages
        run: |
          git diff --exit-code -- site
          test -z "$(git status --porcelain -- site)" || { git status --porcelain -- site; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
